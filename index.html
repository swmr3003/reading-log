<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>読書記録</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="読書記録">
<meta name="theme-color" content="#0A0A0A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0A0A0A; --white:#FFFFFF; --ink:#0A0A0A; --muted:#6B6B6B; --faint:#A3A3A3;
  --line:#EBEBEB; --tile:#F0F0F0; --dark2:#1F1F1F; --dark3:#2A2A2A; --red:#E5383B;
  --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0A0A0A}
html,body{margin:0;background:#0A0A0A;color:var(--ink);font-family:'Inter','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--white);position:relative}
.hidden{display:none!important}
.label{font-size:12px;font-weight:700;letter-spacing:.2em}
.sec-label{font-size:11px;font-weight:800;letter-spacing:.2em}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.pill{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--black);background:var(--white);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.on{background:var(--black);color:var(--white)}
.btn{height:48px;border-radius:999px;border:1.5px solid var(--black);background:var(--white);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.black{background:var(--black);color:var(--white)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--white)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}

/* ----- 黒いヘッダー ----- */
.dark-head{background:var(--black);color:var(--white);padding:calc(14px + var(--safe-t)) 20px 20px;display:flex;flex-direction:column;gap:14px}
.dark-head .row{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.big-num{display:flex;align-items:flex-end;gap:10px}
.big-num b{font-size:104px;font-weight:900;line-height:.82;letter-spacing:-.06em}
.big-num span{font-size:18px;font-weight:700;padding-bottom:4px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:var(--dark2);border-radius:999px}
.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:15px;min-width:0}
.search input::placeholder{color:#8C8C8C}

/* ----- 本棚 ----- */
.filters{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 20px 0}
.filters .left{display:flex;gap:8px;min-width:0}
.sel-pill{position:relative;display:inline-flex;color:var(--ink)}
.sel-pill.on{color:#fff}
.sel-pill select{appearance:none;-webkit-appearance:none;height:36px;padding:0 30px 0 14px;border-radius:999px;border:1.5px solid var(--black);background:var(--white);font-size:13px;font-weight:700;max-width:150px}
.sel-pill.on select{background:var(--black);color:#fff}
.sel-pill::after{content:'';position:absolute;right:13px;top:14px;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);pointer-events:none}
.toggle{display:flex;border:1.5px solid var(--black);border-radius:999px;overflow:hidden;flex:none}
.toggle button{width:42px;height:33px;border:0;background:var(--white);display:flex;align-items:center;justify-content:center;padding:0}
.toggle button.on{background:var(--black);color:#fff}
.shelf-body{padding:16px 20px calc(var(--nav-h) + var(--safe-b) + 24px)}
.group-head{display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--black);padding-top:6px;margin:0 0 12px}
.group-head h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.03em}
.group-head .cnt{font-size:13px;font-weight:700}
.sort-btn{height:32px;border:0;background:transparent;font-size:11px;font-weight:800;letter-spacing:.14em;display:flex;align-items:center;gap:6px;padding:0;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:28px}
.tile{aspect-ratio:1/1;background:var(--tile);border:0;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 3px 8px rgba(0,0,0,.22);display:block}
.ph{height:100%;aspect-ratio:2/3;background:#2B2B2B;color:#F2F2F2;padding:6px 5px;font-size:10px;font-weight:700;line-height:1.3;text-align:left;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.22);word-break:break-all}
.list{margin-bottom:28px}
.row-item{display:flex;align-items:center;gap:14px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.thumb{width:36px;height:54px;flex:none;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:6px;padding:3px;height:100%;width:100%;aspect-ratio:auto;box-shadow:none}
.row-item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-item .t b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .d{font-size:12px;font-weight:800;letter-spacing:.06em;flex:none}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}

/* ----- 下のメニュー ----- */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--black);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
nav.tabs.on-dark{border-top:1px solid #222}
nav.tabs button{border:0;border-top:2px solid transparent;background:transparent;color:#7A7A7A;font-size:10px;font-weight:800;letter-spacing:.16em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
nav.tabs button.on{color:#fff;border-top-color:#fff}
nav.tabs .ic{position:relative;display:inline-flex}
nav.tabs .badge{position:absolute;top:-5px;right:-10px}

/* ----- 集計 ----- */
.stats{background:var(--black);color:#fff;min-height:100vh;min-height:100dvh;padding-top:var(--safe-t);padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
.stats-top{padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;min-height:58px}
.sel-pill.dark{color:#fff}
.sel-pill.dark select{border-color:#fff;background:transparent;color:#fff}
.sel-pill.dark.on{color:var(--black)}
.sel-pill.dark.on select{background:#fff;color:var(--black)}
.stats .big-num{padding:22px 20px 0}
.more-btn{align-self:flex-start;height:40px;margin-top:6px;border:0;background:transparent;color:#fff;font-size:11px;font-weight:800;letter-spacing:.16em;text-decoration:underline;padding:0}
.stats .big-num b{font-size:112px}
.bars{margin:16px 20px 0;display:flex;align-items:flex-end;gap:3px;height:116px}
.bars button{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.bars .v{font-size:12px;font-weight:900;color:#fff;height:14px}
.bars .b{width:100%;background:#4A4A4A;min-height:2px;display:block}
.bars button.sel .b{background:#fff}
.bars .l{font-size:9px;font-weight:700;color:#8C8C8C;white-space:nowrap}
.bars button.sel .l{color:#fff}
.stat-sec{margin:24px 20px 0;display:flex;flex-direction:column}
.stat-sec h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.2em;color:#8C8C8C}
.stat-sec h3 em{font-style:normal;color:#fff}
.g-row{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:10px;min-height:30px;border:0;background:transparent;color:#fff;padding:0;text-align:left;width:100%}
.g-row .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row .track{height:6px;background:#222;display:block}
.g-row .fill{height:100%;background:#fff;display:block}
.g-row .c{font-size:13px;font-weight:700;text-align:right}
.a-row{display:flex;align-items:center;gap:12px;height:40px;border:0;border-bottom:1px solid #222;background:transparent;color:#fff;padding:0;text-align:left;width:100%}
.a-row .r{width:18px;font-size:13px;font-weight:900}
.a-row .n{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row .c{font-size:13px;font-weight:700}

/* ----- 要チェック ----- */
.check-body{padding:20px 20px calc(var(--nav-h) + var(--safe-b) + 24px);display:flex;flex-direction:column;gap:26px}
.card{border-top:3px solid var(--black);padding-top:12px;display:flex;flex-direction:column;gap:14px}
.card .top{display:flex;align-items:center;justify-content:space-between}
.card .date{font-size:12px;font-weight:800;letter-spacing:.14em}
.tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;border:1.5px solid var(--black)}
.tag.fill{background:var(--black);color:#fff}
.card .mid{display:flex;gap:14px}
.card .cv{width:56px;height:84px;flex:none;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .cv img{width:100%;height:100%;object-fit:cover}
.card dl{margin:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.card dt{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--muted)}
.card dd{margin:2px 0 0;font-size:14px;word-break:break-word}
.card dd.main{font-size:16px;font-weight:800}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* ----- 詳細シート ----- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,10,.55);border:0;padding:0}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 24px calc(28px + var(--safe-b));display:flex;flex-direction:column;gap:20px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.swipe-l{animation:inL .22s ease-out}
.swipe-r{animation:inR .22s ease-out}
.edge-bump{animation:bump .25s ease-out}
@keyframes bump{0%,100%{transform:none}40%{transform:translateX(var(--bump,8px))}}
.grab{display:flex;justify-content:center;position:relative;min-height:24px}
.grab span{width:40px;height:4px;border-radius:2px;background:#D4D4D4;margin-top:4px}
.grab .icon-btn{position:absolute;right:-12px;top:-6px}
.big-cover{display:flex;justify-content:center;padding-top:6px}
.big-cover img{max-width:200px;max-height:300px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.big-cover .ph{width:196px;height:294px;font-size:22px;padding:18px 16px}
.info{display:flex;flex-direction:column;gap:6px}
.info .meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.info .meta .d{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.info h1{margin:4px 0 0;font-size:30px;font-weight:900;line-height:1.2;letter-spacing:-.03em;word-break:break-word}
.info .au{font-size:15px;color:#555}

/* ----- 全画面のページ(編集・設定など) ----- */
.page{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;background:rgba(0,0,0,.2)}
.page-in{width:100%;max-width:480px;height:100%;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
.page-bar{position:sticky;top:0;z-index:2;background:#fff;height:calc(60px + var(--safe-t));padding-top:var(--safe-t)!important;box-shadow:inset 0 var(--safe-t) 0 #0A0A0A;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px}
.page-title{padding:0 20px 18px}
.page-title h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-.03em}
.page-body{padding:0 20px calc(40px + var(--safe-b));display:flex;flex-direction:column;gap:28px}
.sec{display:flex;flex-direction:column}
.sec-head{display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--black);padding:8px 0 4px;min-height:40px}
.link-row{min-height:56px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0;width:100%;text-align:left;font-size:15px;font-weight:700}
.link-row .grow{flex:1;min-width:0}
.link-row small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.save-btn{height:36px;padding:0 18px;border-radius:999px;border:0;background:var(--black);color:#fff;font-size:12px;font-weight:800;letter-spacing:.14em}
.text-btn{height:32px;border:0;background:transparent;font-size:11px;font-weight:800;letter-spacing:.14em;text-decoration:underline;padding:0}
.u-input{height:44px;border:0;border-bottom:1.5px solid var(--black);padding:0;font-size:16px;font-weight:700;background:transparent;outline:none;width:100%;min-width:0;border-radius:0}
.u-input::placeholder{color:var(--faint);font-weight:400}
.cand{display:flex;align-items:center;gap:12px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.cand .thumb{width:36px;height:54px}
.cand .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cand .t b{font-size:14px;font-weight:800}
.cand .t span{font-size:12px;color:var(--muted)}
.radio{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--black);box-shadow:inset 0 0 0 3px #fff}
.radio.on{background:var(--black)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cover-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.cover-grid button{aspect-ratio:2/3;border:0;padding:0;background:var(--tile);overflow:hidden;outline-offset:2px}
.cover-grid button.on{outline:3px solid var(--black)}
.cover-grid img{width:100%;height:100%;object-fit:cover}
.switch{width:52px;height:30px;flex:none;border-radius:999px;border:1.5px solid var(--black);background:#fff;position:relative;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--black);transition:left .15s}
.switch.on{background:var(--black)}
.switch.on i{left:25px;background:#fff}
.lock{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.g-item{border-bottom:1px solid var(--line)}
.g-item > button{display:flex;align-items:center;gap:10px;min-height:56px;width:100%;border:0;background:transparent;padding:0;text-align:left}
.g-item .n{flex:1;font-size:16px;font-weight:800}
.g-item .c{font-size:14px;font-weight:800}
.g-panel{padding:0 0 18px;display:flex;flex-direction:column;gap:16px}
.mini-label{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--muted)}
.round-sel{flex:1;height:42px;border:1.5px solid var(--black);border-radius:999px;background:#fff;font-size:14px;padding:0 14px;min-width:0}
.map-row{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--line)}
.map-row .cat{flex:1;min-width:0;font-size:14px;font-weight:700;word-break:break-word}
.map-row .cat small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.map-row select{width:132px;height:40px;border:1.5px solid var(--black);border-radius:999px;background:#fff;font-size:13px;font-weight:700;padding:0 12px;flex:none}
.map-row select.need{background:var(--black);color:#fff}
.log-row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.log-row .top{display:flex;gap:10px;font-size:11px;color:var(--muted)}
.log-row .top b{color:var(--ink);font-weight:800;letter-spacing:.06em}
.log-row .tt{font-size:14px;font-weight:700;word-break:break-word}
.log-row .dd{font-size:12px;color:var(--muted);word-break:break-word}

/* ----- 読み込み中・お知らせ ----- */
.busy{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid #D4D4D4;border-top-color:var(--black);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%);z-index:95;max-width:min(440px,calc(100% - 32px));background:var(--black);color:#fff;font-size:13px;font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}
.toast.err{background:var(--red)}
.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--black);color:#fff}
.boot .label{color:#8C8C8C}
.login{align-items:stretch;justify-content:center;padding:24px 28px calc(24px + var(--safe-b));gap:18px}
.login h1{margin:0 0 6px;font-size:40px;font-weight:900;letter-spacing:-.03em}
.login form{display:flex;flex-direction:column;gap:12px}
.login input{height:52px;border:0;border-radius:999px;background:var(--dark2);color:#fff;padding:0 20px;font-size:16px;outline:none}
.login input::placeholder{color:#8C8C8C}
.login .btn{height:52px;border-color:#fff}
.login .btn.white{background:#fff;color:var(--black)}
.login .err{margin:0;color:#FF8A8C;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="app"><div class="boot"><div class="spin" style="border-color:#333;border-top-color:#fff"></div><span class="label">LIBRARY</span></div></div>
<div id="layer"></div>
<div id="busy" class="busy hidden"><div class="spin"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   状態
   ========================================================= */
var S = {
  books: [], genres: [], mappings: [], settings: {},
  tab: 'shelf',
  view: pref('view', 'grid'),
  year: 'latest',
  genre: '',
  q: '',
  sort: 'date-desc',
  statsYear: null, statsSel: -1, allGenres: false, allAuthors: false,
};
var EDIT = null;   // 編集中の状態
var NOW_YEAR = new Date().getFullYear();

function pref(k, d) { try { return localStorage.getItem('rl_' + k) || d; } catch (e) { return d; } }
function savePref(k, v) { try { localStorage.setItem('rl_' + k, v); } catch (e) {} }

/* =========================================================
   サーバー呼び出し
   ========================================================= */
// GASのWebアプリのURL(データのやり取り先)
var API_URL = 'https://script.google.com/macros/s/AKfycbzTid_soGKLnee5kqwEKl_2SBKEZ3itSCMy7VsX4sc0iztYxpv5jKLcrooctq74u2ft/exec';

function getToken() { try { return localStorage.getItem('rl_token') || ''; } catch (e) { return ''; } }
function setToken(t) { try { if (t) localStorage.setItem('rl_token', t); else localStorage.removeItem('rl_token'); } catch (e) {} }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: getToken(), fn: fn, args: args }),
  }).then(function (r) {
    if (!r.ok) throw new Error('通信エラー(' + r.status + ')');
    return r.json();
  }).then(function (res) {
    if (!res.ok) {
      var err = new Error(res.error || 'エラーが起きました');
      err.code = res.code;
      if (res.code === 'auth') { setToken(''); showLogin(res.error); }

}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) { return String(s || '').normalize('NFKC').toLowerCase().replace(/\s+/g, ''); }
function yearOf(b) { return Number(String(b.date).slice(0, 4)) || 0; }
function monthOf(b) { return Number(String(b.date).slice(5, 7)) || 0; }
function dotDate(d) { return String(d).replace(/-/g, '.'); }
function bookById(id) { for (var i = 0; i < S.books.length; i++) if (S.books[i].id === id) return S.books[i]; return null; }
function years() {
  var set = {};
  S.books.forEach(function (b) { var y = yearOf(b); if (y) set[y] = 1; });
  return Object.keys(set).map(Number).sort(function (a, b) { return b - a; });
}
function checkBooks() { return S.books.filter(function (b) { return b.status === '要チェック'; }); }
function authorsOf(b) { return String(b.author || '').split(/[、,]/).map(function (s) { return s.trim(); }).filter(Boolean); }

function coverHtml(b, cls) {
  if (b.cover) {
    return '<img src="' + esc(b.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer" data-ph="' + esc(b.title) + '">';
  }

}

document.addEventListener('error', function (e) {
  var img = e.target;
  if (img.tagName !== 'IMG' || !img.hasAttribute('data-ph')) return;
  var d = document.createElement('div');
  d.className = 'ph';

}, true);

function amazonUrl(b) {
  var isbn = String(b.isbn || '').replace(/[^\dXx]/g, '');
  if (isbn.length === 13 && isbn.indexOf('978') === 0) isbn = isbn13to10(isbn);
  if (isbn.length === 10) return 'https://www.amazon.co.jp/dp/' + isbn.toUpperCase();
  return 'https://www.amazon.co.jp/s?k=' + encodeURIComponent(isbn || b.title) + '&i=stripbooks';
}
function isbn13to10(s) {
  var core = s.slice(3, 12), sum = 0;
  for (var i = 0; i < 9; i++) sum += (10 - i) * Number(core[i]);
  var c = (11 - (sum % 11)) % 11;
  return core + (c === 10 ? 'X' : String(c));
}

var SORTS = [
  { k: 'date-desc', label: 'NEWEST' },
  { k: 'date-asc', label: 'OLDEST' },
  { k: 'title', label: 'TITLE' },
  { k: 'author', label: 'AUTHOR' },
];

function filteredBooks() {
  var y = currentYear();
  var q = norm(S.q);
  var list = S.books.filter(function (b) {
    if (y !== 'all' && yearOf(b) !== y) return false;
    if (S.genre === '__none' && b.genre) return false;
    if (S.genre && S.genre !== '__none' && b.genre !== S.genre) return false;
    if (q && norm(b.title + ' ' + b.author + ' ' + b.matched).indexOf(q) < 0) return false;
    return true;
  });
  var s = S.sort;
  list.sort(function (a, b) {
    if (s === 'date-asc') return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    if (s === 'title') return a.title.localeCompare(b.title, 'ja');
    if (s === 'author') return (a.author || '￿').localeCompare(b.author || '￿', 'ja') || (a.date < b.date ? 1 : -1);
    return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
  });
  return list;
}

function renderShelfBody() {
  var el = document.getElementById('shelfBody');
  if (!el) return;
  var list = filteredBooks();
  var sortLabel = SORTS.filter(function (x) { return x.k === S.sort; })[0].label;
  var sortBtn = '<button class="sort-btn" data-act="sort">' + IC.sort + sortLabel + '</button>';

    list.forEach(function (b) {
      var y = yearOf(b);

      cur.items.push(b);

    groups.push({ key: 'all', title: 'ALL', items: list });

function statsData() {
  var ys = years();
  if (S.statsYear !== 'all' && (S.statsYear == null || ys.indexOf(S.statsYear) < 0)) S.statsYear = ys[0] || 'all';
  var isYear = S.statsYear !== 'all';
  var bars;
  if (isYear) {
    bars = [];
    for (var m = 1; m <= 12; m++) bars.push({ label: String(m), name: m + '月', v: 0, test: (function (mm) { return function (b) { return monthOf(b) === mm; }; })(m) });
    S.books.forEach(function (b) { if (yearOf(b) === S.statsYear) { var mm = monthOf(b); if (mm) bars[mm - 1].v++; } });
  } else {
    var min = ys.length ? ys[ys.length - 1] : NOW_YEAR, max = ys.length ? ys[0] : NOW_YEAR;
    bars = [];
    for (var y = min; y <= max; y++) bars.push({ label: '’' + String(y).slice(2), name: y + '年', year: y, v: 0, test: (function (yy) { return function (b) { return yearOf(b) === yy; }; })(y) });
    S.books.forEach(function (b) { var yy = yearOf(b); if (yy >= min) bars[yy - min].v++; });
  }
  if (S.statsSel >= bars.length) S.statsSel = -1;
  var base = isYear ? S.books.filter(function (b) { return yearOf(b) === S.statsYear; }) : S.books.slice();
  var scoped = S.statsSel >= 0 ? base.filter(bars[S.statsSel].test) : base;
  var gc = {}, ac = {};
  scoped.forEach(function (b) {
    var g = b.genre || '未設定'; gc[g] = (gc[g] || 0) + 1;
    authorsOf(b).forEach(function (a) { ac[a] = (ac[a] || 0) + 1; });
  });
  var genres = Object.keys(gc).map(function (k) { return { name: k, v: gc[k] }; }).sort(function (a, b) { return b.v - a.v; });
  var authors = Object.keys(ac).map(function (k) { return { name: k, v: ac[k] }; })
    .sort(function (a, b) { return b.v - a.v || a.name.localeCompare(b.name, 'ja'); });
  return { isYear: isYear, ys: ys, bars: bars, total: base.length, genres: genres, authors: authors };
}

function openEdit(id, startSearch) {
  var b = bookById(id);
  if (!b) return;
  EDIT = {
    id: id, book: b,
    cand: null, candidates: null, searching: false, query: b.title,
    f: { author: b.author, genre: b.genre, cover: b.cover, isbn: b.isbn, pages: b.pages === '' ? '' : String(b.pages) },
    dirty: {},
    check: b.status === '要チェック',
    coverMode: '',
  };
  renderEdit();
  if (startSearch) runSearch();
}

function renderEdit() {
  var e = EDIT, b = e.book;
  var cands = '';
  if (e.searching) cands = '<div class="empty" style="padding:20px 0">検索中…</div>';
  else if (e.candidates && !e.candidates.length) cands = '<div class="empty" style="padding:20px 0">見つかりませんでした</div>';
  else if (e.candidates) cands = e.candidates.map(function (c, i) {

}

function runSearch() {
  var q = document.getElementById('eQuery');
  if (q) EDIT.query = q.value;
  EDIT.searching = true;
  renderEdit();
  var id = EDIT.id;
  call('apiSearch', EDIT.query).then(function (list) {
    if (!EDIT || EDIT.id !== id) return;
    EDIT.searching = false;
    EDIT.candidates = list || [];
    renderEdit();
  }, function (err) {
    if (!EDIT || EDIT.id !== id) return;
    EDIT.searching = false;
    EDIT.candidates = [];
    renderEdit();
    toast(errMsg(err), true);
  });
}

function pickCandidate(i) {
  var c = EDIT.candidates[i];
  if (!c) return;
  if (EDIT.cand && EDIT.cand.id === c.id) { EDIT.cand = null; renderEdit(); return; }
  EDIT.cand = c;
  // 選んだ本の情報を入力欄に入れる(保存時に本の情報としてまとめて反映する)
  EDIT.f.author = c.authors; EDIT.f.cover = c.cover; EDIT.f.isbn = c.isbn; EDIT.f.pages = c.pages === '' ? '' : String(c.pages);
  ['author', 'cover', 'isbn', 'pages'].forEach(function (k) { delete EDIT.dirty[k]; });
  EDIT.check = false;
  renderEdit();
}

function saveEdit() {
  var e = EDIT;
  var cols = { author: '著者', genre: 'ジャンル', cover: '表紙URL', isbn: 'ISBN', pages: 'ページ数' };
  var fields = {};
  Object.keys(e.dirty).forEach(function (k) { fields[cols[k]] = e.f[k]; });
  var payload = { candidate: e.cand, fields: fields };
  var wasCheck = e.book.status === '要チェック';
  if (e.check !== wasCheck) payload.check = e.check;
  if (!e.cand && !Object.keys(fields).length && payload.check === undefined) { closeLayer(); return; }
  withBusy(call('apiSaveEdit', e.id, payload)).then(function (row) {
    for (var i = 0; i < S.books.length; i++) if (S.books[i].id === row.id) S.books[i] = row;
    saveCache();
    closeLayer();
    render();
    toast('保存しました');
  });
}

};
// よく出る3桁の名前
var NDC3 = {
  '007':'情報科学','159':'人生訓・教訓','289':'個人の伝記','290':'地理・紀行','304':'社会評論','336':'経営管理','338':'金融・証券',
  '366':'労働','367':'家族・性','498':'衛生・健康','596':'料理','910':'日本文学(評論)','911':'詩歌','912':'戯曲','913':'日本の小説',
  '914':'日本の随筆','915':'日記・書簡・紀行','916':'記録・ルポ','918':'作品集','923':'中国の小説','933':'英米の小説','943':'ドイツの小説',
  '953':'フランスの小説','963':'スペインの小説','973':'イタリアの小説','983':'ロシアの小説','993':'その他の小説'
};
function ndcName(code) {
  var c = String(code);
  if (c.length >= 3 && NDC3[c.slice(0, 3)]) return NDC3[c.slice(0, 3)];
  if (c.length >= 2 && NDC2[c.slice(0, 2)]) return NDC2[c.slice(0, 2)];
  if (c.length === 1) return NDC2[c + '0'] || '';
  return '';
}
function isNdcKey(k) { return /^\d/.test(String(k)); }
function mapLookup() {
  var m = {};
  S.mappings.forEach(function (x) { m[String(x.category).toLowerCase()] = x.genre; });
  return m;
}
// サーバーと同じ決め方:分類番号は頭から長く一致するもの、なければカテゴリ
function effectiveGenre(ndc, cat, m) {
  var n = String(ndc || '');
  for (var len = n.length; len >= 1; len--) { var k = n.slice(0, len); if (m[k]) return { genre: m[k], key: k }; }
  var c = String(cat || '').trim().toLowerCase();
  if (c && m[c]) return { genre: m[c], key: c };
  var h = c.split('/')[0].trim();
  if (h && m[h]) return { genre: m[h], key: h };
  return { genre: '', key: '' };
}
// 本に出てくる分類番号(3桁)とカテゴリの一覧
function mappingRows() {
  var m = mapLookup(), ndc = {}, cat = {};
  S.books.forEach(function (b) {
    var n = String(b.ndc || '').replace(/[^\d]/g, '').slice(0, 3);
    if (n) { ndc[n] = (ndc[n] || 0) + 1; return; }
    var c = String(b.category || '').trim();
    if (c) cat[c] = (cat[c] || 0) + 1;
  });
  var nd = Object.keys(ndc).sort().map(function (k) { var e = effectiveGenre(k, '', m); return { key: k, v: ndc[k], genre: e.genre, own: e.key === k }; });
  var ct = Object.keys(cat).sort(function (a, b) { return cat[b] - cat[a]; }).map(function (k) {
    var e = effectiveGenre('', k, m); return { key: k, v: cat[k], genre: e.genre, own: e.key === k.toLowerCase() };
  });
  return { ndc: nd, cat: ct };
}
function unmappedCategories() {
  var r = mappingRows();
  return r.ndc.concat(r.cat).filter(function (x) { return !x.genre; });
}

    (r.ndc.length ? '<section class="sec"><div class="sec-head"><span class="sec-label">CLASS</span><span style="font-size:11px;color:#6B6B6B">分類番号ごと</span></div>' +
      r.ndc.map(function (x) { return row(x, x.key + ' ' + ndcName(x.key)); }).join('') + '</section>' : '') +
    (r.cat.length ? '<section class="sec"><div class="sec-head"><span class="sec-label">CATEGORY</span><span style="font-size:11px;color:#6B6B6B">分類番号がない本</span></div>' +
      r.cat.map(function (x) { return row(x, x.key); }).join('') + '</section>' : '') +
    '<section class="sec"><div class="sec-head"><span class="sec-label">RULES</span><span style="font-size:11px;color:#6B6B6B">登録済みの対応</span></div>' +
      (rules.length ? rules.map(function (m) {
        var label = isNdcKey(m.category) ? m.category + ' ' + ndcName(m.category) : m.category;
        return '<div class="map-row"><span class="cat">' + esc(label) + '</span>' + IC.arrow + genreSelect(m.category, m.genre) + '</div>';
      }).join('') : '<div class="empty">まだありません</div>') + '</section>');
}

function logHtml() {
  if (!LOGS) {
    LOGS = 'loading';
    call('apiGetLog').then(function (l) { LOGS = l; if (PAGE === 'log') renderPage(); }, function (e) { LOGS = []; toast(errMsg(e), true); });
  }
  var body = LOGS === 'loading' ? '<div class="empty">読み込み中…</div>'
    : !LOGS.length ? '<div class="empty">ログはありません</div>'
    : '<div style="border-top:3px solid #0A0A0A">' + LOGS.map(function (l) {
        return '<div class="log-row"><div class="top"><b>' + esc(l.type) + '</b><span>' + esc(l.time) + '</span></div>' +
          (l.title ? '<div class="tt">' + esc(l.title) + '</div>' : '') + (l.detail ? '<div class="dd">' + esc(l.detail) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  return pageShell('LOG', '同期ログ', 'settings', '', body);
}

function snapshotThen(p, msg) {
  return withBusy(p).then(function (s) {
    applySnapshot(s);
    render();
    if (PAGE) renderPage();
    if (msg) toast(msg);
  });
}

/* =========================================================
   操作
   ========================================================= */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT') return;
  var a = t.getAttribute('data-act');
  var d = t.dataset;
  switch (a) {
    case 'tab':
      S.tab = d.tab; closeLayer(); PAGE = null; render(); break;
    case 'view':
      S.view = d.v; savePref('view', d.v);
      document.querySelectorAll('[data-act="view"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S.view); });
      renderShelfBody(); break;
    case 'sort':
      var i = SORTS.map(function (x) { return x.k; }).indexOf(S.sort);
      S.sort = SORTS[(i + 1) % SORTS.length].k; renderShelfBody(); break;
    case 'detail': openDetail(d.id); break;
    case 'close-layer': closeLayer(); PAGE = null; break;
    case 'edit': PAGE = null; openEdit(d.id, d.search === '1'); break;
    case 'confirm':
      withBusy(call('apiConfirm', d.id)).then(function (row) {
        for (var k = 0; k < S.books.length; k++) if (S.books[k].id === row.id) S.books[k] = row;
        saveCache(); render(true); toast('OKにしました');
      }); break;

    // 集計
    case 'st-bar': var bi = Number(d.i); S.statsSel = S.statsSel === bi ? -1 : bi; render(true); break;
    case 'st-more':
      if (d.k === 'g') S.allGenres = !S.allGenres; else S.allAuthors = !S.allAuthors;
      render(true); break;
    case 'st-genre':
    case 'st-author':
      var sd = statsData();
      var yr = sd.isYear ? S.statsYear : (S.statsSel >= 0 ? sd.bars[S.statsSel].year : 'all');
      S.year = String(yr); S.genre = ''; S.q = '';
      if (a === 'st-genre') S.genre = d.g === '未設定' ? '__none' : d.g; else S.q = d.a;
      S.tab = 'shelf'; render(); break;

    // 編集
    case 'e-search': runSearch(); break;
    case 'pick': pickCandidate(Number(d.i)); break;
    case 'e-genre': EDIT.f.genre = d.g; EDIT.dirty.genre = 1; renderEdit(); break;
    case 'e-covermode':
      EDIT.coverMode = EDIT.coverMode === d.m ? '' : d.m;
      if (EDIT.coverMode === 'pick' && !EDIT.candidates && !EDIT.searching) runSearch(); else renderEdit();
      break;
    case 'e-cover': EDIT.f.cover = d.url; EDIT.dirty.cover = 1; renderEdit(); break;
    case 'e-check': EDIT.check = !EDIT.check; renderEdit(); break;
    case 'e-save': saveEdit(); break;

    // 設定
    case 'settings': openPage('settings'); break;
    case 'genres': GOPEN = -1; GADD = false; openPage('genres'); break;
    case 'map': MADD = false; openPage('map'); break;
    case 'log': LOGS = null; openPage('log'); break;
    case 'resync':
      if (confirm('カレンダーの全予定を読み直します。本の情報の取得は、このあと自動で進みます。よろしいですか？'))
        snapshotThen(call('apiResync'), '取り直しました');
      break;

    // ジャンル
    case 'g-toggle': GOPEN = GOPEN === Number(d.i) ? -1 : Number(d.i); GADD = false; renderPage(); break;
    case 'g-add': GADD = !GADD; GOPEN = -1; renderPage(); var gn = document.getElementById('gNew'); if (gn) gn.focus(); break;
    case 'g-add-cancel': GADD = false; renderPage(); break;
    case 'g-add-save':
      var nv = document.getElementById('gNew').value.trim();
      if (!nv) return;
      GADD = false; snapshotThen(call('apiAddGenre', nv), '追加しました'); break;
    case 'g-rename':
      var nn = document.getElementById('gName').value.trim();
      if (!nn || nn === d.g) return;
      snapshotThen(call('apiRenameGenre', d.g, nn), '名前を変えました'); break;
    case 'g-move':
      GOPEN = Math.max(0, Math.min(S.genres.length - 1, GOPEN + Number(d.d)));
      snapshotThen(call('apiMoveGenre', d.g, Number(d.d))); break;
    case 'g-delete':
      var mt = document.getElementById('gMoveTo').value;
      if (!confirm('「' + d.g + '」を削除します。' + (mt ? 'このジャンルの本は「' + mt + '」に移します。' : 'このジャンルの本は未設定になります。'))) return;
      GOPEN = -1; snapshotThen(call('apiDeleteGenre', d.g, mt), '削除しました'); break;

    // ジャンル変換
    case 'm-add': MADD = !MADD; renderPage(); break;
    case 'm-add-save':
      var mc = document.getElementById('mNew').value.trim();
      if (!mc) return;
      MADD = false; snapshotThen(call('apiSetMapping', mc, document.getElementById('mNewGenre').value), '追加しました'); break;
  }
});

document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'sYear') { S.statsYear = t.value === 'all' ? 'all' : Number(t.value); S.statsSel = -1; render(true); return; }
  if (t.id === 'fYear') { S.year = t.value; t.parentNode.classList.toggle('on', t.value !== 'all'); renderShelfBody(); }
  else if (t.id === 'fGenre') { S.genre = t.value; t.parentNode.classList.toggle('on', !!t.value); renderShelfBody(); }
  else if (t.id === 'sCal') {
    if (t.value === S.settings.calendarId) return;
    if (!confirm('読書カレンダーを切り替えると、読了記録は新しいカレンダーの内容で作り直されます(手で直した内容も消えます)。よろしいですか？')) {
      t.value = S.settings.calendarId; return;
    }
    snapshotThen(call('apiSetCalendar', t.value), '切り替えました');
  }
  else if (t.dataset && t.dataset.act === 'm-set') {
    var v = t.value;
    if (!v) return;
    snapshotThen(call('apiSetMapping', t.dataset.cat, v === '__del' ? '' : v), v === '__del' ? '削除しました' : '保存しました');
  }
});

var qTimer;
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'q') { S.q = t.value; clearTimeout(qTimer); qTimer = setTimeout(renderShelfBody, 150); return; }
  if (!EDIT) return;
  var map = { eAuthor: 'author', eIsbn: 'isbn', ePages: 'pages', eCoverUrl: 'cover' };
  if (map[t.id]) { EDIT.f[map[t.id]] = t.value; EDIT.dirty[map[t.id]] = 1; }
  if (t.id === 'eQuery') EDIT.query = t.value;
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'eQuery') { ev.preventDefault(); runSearch(); }
});

/* =========================================================
   左右のスワイプで年を切り替える(SHELF・STATS)
   指を右へ → 前の年(古い)、指を左へ → 次の年(新しい)
   ========================================================= */
var SW = null;
document.addEventListener('touchstart', function (ev) {
  SW = null;
  if (ev.touches.length !== 1) return;
  if (document.getElementById('layer').innerHTML) return;      // 詳細・編集・設定を開いているときは無効
  if (S.tab !== 'shelf' && S.tab !== 'stats') return;
  if (ev.target.closest('input, select, textarea, nav')) return;
  var t = ev.touches[0];
  SW = { x: t.clientX, y: t.clientY, time: Date.now() };
}, { passive: true });

document.addEventListener('touchend', function (ev) {
  if (!SW) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - SW.x, dy = t.clientY - SW.y, dt = Date.now() - SW.time;
  SW = null;
  // 横方向にはっきり動かしたときだけ(縦のスクロールと区別する)
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8 || dt > 700) return;
  swipeYear(dx > 0 ? 1 : -1);
}, { passive: true });

// dir = 1 で前の年(古い)、-1 で次の年(新しい)
function swipeYear(dir) {
  var ys = years(); // 新しい順
  if (!ys.length) return;
  var cur = S.tab === 'stats' ? S.statsYear : currentYear();
  var i = cur === 'all' ? -1 : ys.indexOf(cur);
  var j = i < 0 ? 0 : i + dir;
  var target = S.tab === 'stats' ? document.querySelector('.stats') : document.getElementById('shelfBody');
  if (j < 0 || j >= ys.length) {
    // 端の年ではそれ以上動かない(少しだけ揺らして知らせる)
    if (target) {
      target.style.setProperty('--bump', (dir > 0 ? 8 : -8) + 'px');
      target.classList.remove('edge-bump'); void target.offsetWidth; target.classList.add('edge-bump');
    }
    return;
  }
  if (S.tab === 'stats') {
    S.statsYear = ys[j]; S.statsSel = -1;
    render(true);
  } else {
    S.year = String(ys[j]);
    var sel = document.getElementById('fYear');
    if (sel) { sel.value = S.year; sel.parentNode.classList.add('on'); }
    renderShelfBody();
    window.scrollTo(0, 0);
  }
  var el = S.tab === 'stats' ? document.querySelector('.stats') : document.getElementById('shelfBody');
  if (el) el.classList.add(dir > 0 ? 'swipe-r' : 'swipe-l');
}

/* =========================================================
   起動
   ========================================================= */
function showLogin(msg) {
  document.getElementById('layer').innerHTML = '';
  EDIT = null; PAGE = null;
  document.getElementById('app').innerHTML =
    '<div class="boot login"><span class="label">LIBRARY</span><h1>読書記録</h1>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
    '<form id="loginForm"><input id="pass" type="password" autocomplete="current-password" placeholder="合言葉" aria-label="合言葉">' +
    '<button class="btn white" type="submit">開く</button></form></div>';
}
document.addEventListener('submit', function (ev) {
  if (ev.target.id !== 'loginForm') return;
  ev.preventDefault();
  var v = document.getElementById('pass').value.trim();
  if (!v) return;
  setToken(v);
  document.getElementById('app').innerHTML = '<div class="boot"><div class="spin" style="border-color:#333;border-top-color:#fff"></div><span class="label">LIBRARY</span></div>';
  boot();
});

function boot() {
  if (!getToken()) { showLogin(''); return; }
  var cached = loadCache();
  var before = cached ? JSON.stringify(cached) : '';
  if (cached) { applySnapshot(cached); render(); }
  call('apiGetAll').then(function (s) {
    applySnapshot(s);
    if (JSON.stringify(s) === before) return;
    if (document.getElementById('layer').innerHTML) { if (PAGE) renderPage(); return; }
    render(true);
  }, function (e) {
    if (e.code === 'auth') return;
    if (cached) { toast(errMsg(e), true); return; }
    document.getElementById('app').innerHTML = '<div class="boot"><span class="label">ERROR</span><span style="font-size:14px;padding:0 24px;text-align:center">' + esc(errMsg(e)) + '</span>' +
      '<button class="btn" style="border-color:#fff;color:#fff;background:transparent;height:44px" onclick="location.reload()">もう一度</button></div>';
  });
}
boot();
</script>
